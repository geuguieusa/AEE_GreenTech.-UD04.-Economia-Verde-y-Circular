<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Salvemos el Planeta - GreenTech</title>

    
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />


    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;300;400;700;900&display=swap"
      rel="stylesheet"
    />


    <style>
      :root {
  --primary-green: #28a745;
  --dark-green: #1e7e34;
  --bg-light: #f4fdf4;
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  font-family: "Montserrat", sans-serif;
  background-color: var(--bg-light);
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}
.hero {
  position: relative;
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 2rem;
  color: white;
  overflow: hidden;
  background-image: url("https://images.unsplash.com/photo-1542601906990-b4d3fb778b09?q=80&w=3000&auto=format&fit=crop");
  background-size: cover;
  background-position: center;
}
.hero-content {
  z-index: 1;
}
h1 {
  font-size: clamp(2.5rem, 5vw, 4.5rem);
  font-weight: 700;
  margin-bottom: 1rem;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
}
p {
  font-size: clamp(1.2rem, 3vw, 1.5rem);
  margin-bottom: 2rem;
  text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
}
.btn-eco {
  background-color: var(--primary-green);
  color: white;
  border: 2px solid var(--dark-green);
  padding: 1rem 2.5rem;
  font-size: 1.25rem;
  font-family: inherit;
  font-weight: 700;
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.3s ease;
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  box-shadow: 0 4px 10px rgba(40, 167, 69, 0.3);
}
.btn-eco:hover {
  background-color: var(--dark-green);
  transform: translateY(-2px);
}
footer {
  background-color: #222;
  color: white;
  text-align: center;
  padding: 1.5rem;
  font-size: 0.9rem;
}
    </style>
<main class="hero">
    <div class="hero-content">
      <h1>Salvemos el Planeta</h1>
      <p>Únete a la revolución verde de GreenTech.</p>
      <button class="btn-eco">
        <i class="fa-solid fa-leaf"></i> Quiero ayudar
      </button>
    </div>
  </main>
  <footer id="footer"></footer>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const footer = document.getElementById('footer');
      const anio = new Date().getFullYear();
      footer.innerHTML = `GreenTech Solutions &copy; ${anio} - Web sostenible de impacto cero`;
    });
  </script>

    <script>
      $(document).ready(function () {
        const anioActual = moment().format("YYYY");
        $("body").append(
          '<footer class="text-center p-3 bg-dark text-white" style="width: 100%;">GreenTech Solutions &copy; ' +
            anioActual +
            " - Haciendo un mundo mejor (pero calentando tu CPU)</footer>",
        );
      });
    </script>
  </body>
</html>
